<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>みんなのスケジュール</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>みんなのスケジュール</h1>
    <div class="auth-area">
      <span id="user-badge"></span>
      <button id="login-btn">Googleでログイン</button>
      <button id="logout-btn" hidden>ログアウト</button>
    </div>
  </header>

  <p id="sync-status" class="sync-status"></p>

  <form id="add-event-form" class="add-event-form" hidden>
    <input type="text" name="title" placeholder="予定タイトル" required />
    <input type="datetime-local" name="start" required />
    <input type="datetime-local" name="end" required />
    <button type="submit">チーム予定を追加</button>
  </form>

  <main>
    <div id="calendar"></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
